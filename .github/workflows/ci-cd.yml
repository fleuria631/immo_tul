# =============================================================
#  CI/CD — ImmoTuléar (Pipeline DevOps Automatisé)
#  Build, Test, & Déploiement automatique sur serveur OVH
# =============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  # ─────────────────────────────────────────────
  #  1. Test & Validation Backend
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: immo_tul_test
          POSTGRES_USER: immo_user
          POSTGRES_PASSWORD: immo_tul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immo_user -d immo_tul_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database schema
        env:
          DATABASE_URL: postgresql://immo_user:immo_tul@localhost:5432/immo_tul_test
          JWT_SECRET: ci_test_secret_key_that_is_long_enough_for_validation_check
          JWT_EXPIRES_IN: 7d
          FRONTEND_URL: http://localhost:5173
        run: node src/init-db.js

      - name: Verify server health check
        env:
          DATABASE_URL: postgresql://immo_user:immo_tul@localhost:5432/immo_tul_test
          JWT_SECRET: ci_test_secret_key_that_is_long_enough_for_validation_check
          JWT_EXPIRES_IN: 7d
          FRONTEND_URL: http://localhost:5173
          PORT: 3001
          UPLOAD_DIR: uploads
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:3001/api/health || exit 1
          kill $SERVER_PID

  # ─────────────────────────────────────────────
  #  2. Lint & Build Frontend
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-new

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front-new/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # ─────────────────────────────────────────────
  #  3. Validation Docker Build
  # ─────────────────────────────────────────────
  docker-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Backend Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: immotulear-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Frontend Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: ./front-new
          push: false
          tags: immotulear-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  #  4. Déploiement Continu Automatisé (CD)
  # ─────────────────────────────────────────────
  deploy:
    name: Continuous Deployment (OVH)
    runs-on: ubuntu-latest
    needs: [docker-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to OVH Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: BACKEND_ENV
          script: |
            set -e
            TARGET_DIR="${{ secrets.PROJECT_PATH || '/home/' }}${{ secrets.SERVER_USER }}/immo_tul"

            echo " Début du déploiement automatisé sur le serveur..."

            # 1. Cloner ou mettre à jour le dépôt
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo " Premier déploiement : clonage du projet..."
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "Récupération de la dernière version main..."
            git fetch origin main
            git reset --hard origin/main

            # 2. Injecter la configuration de production (.env)
            echo " Configuration des variables d'environnement..."
            cat << 'EOF' > backend/.env
            ${{ secrets.BACKEND_ENV }}
            EOF

            # 3. Construire et redémarrer les conteneurs Docker
            echo " Reconstruction et démarrage des conteneurs..."
            docker compose down --remove-orphans || true
            docker compose build --no-cache
            docker compose up -d

            # 4. Attendre que la base et le backend soient prêts
            echo " Attente du démarrage complet des services..."
            for i in $(seq 1 30); do
              if docker compose exec -T backend wget -qO- http://localhost:3001/api/health > /dev/null 2>&1; then
                echo " Backend prêt et opérationnel !"
                break
              fi
              echo " En attente du backend ($i/30)..."
              sleep 2
            done

            # 5. Initialisation de la base de données
            echo " Initialisation / migration de la base de données..."
            docker compose exec -T backend node src/init-db.js
            docker compose exec -T backend node createAdmin.js || true

            # 6. Health check de confirmation
            echo " Vérification du bon fonctionnement..."
            docker compose ps

            echo " Test d'accès HTTP local :"
            curl -f http://localhost:3001/api/health && echo "✅ API Backend OK" || echo "⚠️ Attention: API Backend injoignable en local"
            curl -f http://localhost:5999/ && echo "✅ Frontend OK" || echo "⚠️ Attention: Frontend port 5999 injoignable en local"

            # 7. Nettoyage des anciennes images
            docker image prune -af --filter "until=48h" || true

            echo "Déploiement terminé avec succès !"
