# =============================================================
#  CI/CD — ImmoTuléar (Chaîne DevOps Complète & Conforme)
#  1. CI : Validation de code, tests & builds
#  2. Package : Publication des images Docker sur GitHub Container Registry (ghcr.io)
#  3. CD : Déploiement sans code source sur serveur OVH Cloud (Images Only)
# =============================================================

name: DevOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────
  #  ÉTAPE 1 : Intégration Continue (CI) - Backend
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: immo_tul_test
          POSTGRES_USER: immo_user
          POSTGRES_PASSWORD: immo_tul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immo_user -d immo_tul_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Validation du schéma de base de données
        env:
          DATABASE_URL: postgresql://immo_user:immo_tul@localhost:5432/immo_tul_test
          JWT_SECRET: ci_test_secret_key_that_is_long_enough_for_validation_check
          JWT_EXPIRES_IN: 7d
          FRONTEND_URL: http://localhost:5173
        run: node src/init-db.js

      - name: Vérification du point de santé de l'API
        env:
          DATABASE_URL: postgresql://immo_user:immo_tul@localhost:5432/immo_tul_test
          JWT_SECRET: ci_test_secret_key_that_is_long_enough_for_validation_check
          JWT_EXPIRES_IN: 7d
          FRONTEND_URL: http://localhost:5173
          PORT: 3001
          UPLOAD_DIR: uploads
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:3001/api/health || exit 1
          kill $SERVER_PID

  # ─────────────────────────────────────────────────────────────
  #  ÉTAPE 1 (suite) : Intégration Continue (CI) - Frontend
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-new

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front-new/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Analyse statique (Linter)
        run: npm run lint

      - name: Test de compilation Vite (Build de validation)
        env:
          VITE_API_URL: /api
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  #  ÉTAPE 2 : Build & Push Docker vers GitHub Packages (GHCR)
  # ─────────────────────────────────────────────────────────────
  publish-images:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées Docker Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Compiler et publier l'image Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Métadonnées Docker Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Compiler et publier l'image Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front-new
          file: ./front-new/Dockerfile
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  #  ÉTAPE 3 : Déploiement Continu (CD) sur le serveur OVH
  #  (Zero-Source : Déploiement basé exclusivement sur les images)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Continuous Deployment (OVH Cloud)
    runs-on: ubuntu-latest
    needs: [publish-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Récupérer docker-compose.prod.yml
        uses: actions/checkout@v4

      - name: Préparer le dossier de déploiement sur OVH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            TARGET_DIR="${{ secrets.PROJECT_PATH || '/home/' }}${{ secrets.SERVER_USER }}/immo_tul"
            mkdir -p "$TARGET_DIR"

      - name: Transférer docker-compose.prod.yml sur le serveur OVH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "${{ secrets.PROJECT_PATH || '/home/' }}${{ secrets.SERVER_USER }}/immo_tul"

      - name: Exécuter le déploiement sur le serveur OVH via SSH
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: BACKEND_ENV,REGISTRY_PASSWORD,ACTOR,REPO
          script: |
            set -e
            TARGET_DIR="${{ secrets.PROJECT_PATH || '/home/' }}${{ secrets.SERVER_USER }}/immo_tul"

            echo "🚀 === Déploiement DevOps ImmoTuléar sur OVH ==="
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # 1. Nettoyage du code source résiduel si un ancien clone git était présent
            if [ -d "$TARGET_DIR/.git" ]; then
              echo "🧹 Suppression du code source résiduel du serveur..."
              rm -rf backend front-new .git
            fi

            # 2. Injection sécurisée des variables d'environnement (.env)
            echo "🔐 Configuration du fichier .env de production..."
            printf '%s\n' "$BACKEND_ENV" > .env
            chmod 600 .env

            # 3. Authentification auprès de ghcr.io
            echo "🔑 Authentification auprès de ghcr.io..."
            echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$ACTOR" --password-stdin || true

            # 4. Pull des images précompilées
            echo "📥 Téléchargement des images de production depuis ghcr.io..."
            docker compose -f docker-compose.prod.yml pull

            # 5. Démarrage des conteneurs
            echo "🔄 Démarrage des conteneurs de production..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 6. Attente et vérification du Backend
            echo "⏳ Vérification du Backend..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T backend wget -qO- http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "✅ Backend opérationnel !"
                break
              fi
              echo "Attente du backend ($i/30)..."
              sleep 2
            done

            # 7. Vérification du Frontend sur le port 5005
            echo "⏳ Vérification du Frontend sur le port 5005..."
            for i in $(seq 1 30); do
              if curl -s -f http://localhost:5005/ > /dev/null 2>&1; then
                echo "✅ Frontend opérationnel sur http://localhost:5005 !"
                break
              fi
              echo "Attente du frontend ($i/30)..."
              sleep 2
            done

            # 8. État des conteneurs
            echo "📋 État des conteneurs :"
            docker compose -f docker-compose.prod.yml ps

            # 9. Nettoyage des anciennes images
            echo "🧹 Nettoyage des anciennes images Docker inutilisées..."
            docker image prune -af --filter "until=24h" || true

            echo "🎉 === Déploiement DevOps terminé avec succès ! ==="
