name: DevOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  #  BACKEND - ÉTAPE 1 : Intégration Continue (CI Backend)
  #  Tests, validation du schéma PostgreSQL et vérification du point de santé
  # ────────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: "Backend CI : Lint, BD & Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: immo_tul_test
          POSTGRES_USER: immo_user
          POSTGRES_PASSWORD: immo_tul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immo_user -d immo_tul_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Backend : Récupération du code"
        uses: actions/checkout@v4

      - name: "Backend : Configuration de Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: "Backend : Installation propre des dépendances"
        run: npm ci

      - name: "Backend : Validation du schéma PostgreSQL"
        env:
          DATABASE_URL: postgresql://immo_user:immo_tul@localhost:5432/immo_tul_test
          JWT_SECRET: ci_test_secret_key_that_is_long_enough_for_validation_check
          JWT_EXPIRES_IN: 7d
          FRONTEND_URL: http://localhost:5173
        run: node src/init-db.js

      - name: "Backend : Vérification du endpoint de santé /api/health"
        env:
          DATABASE_URL: postgresql://immo_user:immo_tul@localhost:5432/immo_tul_test
          JWT_SECRET: ci_test_secret_key_that_is_long_enough_for_validation_check
          JWT_EXPIRES_IN: 7d
          FRONTEND_URL: http://localhost:5173
          PORT: 3001
          UPLOAD_DIR: uploads
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:3001/api/health || exit 1
          kill $SERVER_PID

  # ────────────────────────────────────────────────────────────────────────────
  #  BACKEND - ÉTAPE 2 : Publication Docker vers GitHub Container Registry (GHCR)
  #  Build multi-stage de l'image Backend et push vers ghcr.io
  # ────────────────────────────────────────────────────────────────────────────
  backend-package:
    name: "Backend Packaging : Build & Push Docker Image (GHCR)"
    runs-on: ubuntu-latest
    needs: [backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "Backend : Récupération du code source"
        uses: actions/checkout@v4

      - name: "Backend : Configuration Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Backend : Connexion au registre GitHub Container Registry (ghcr.io)"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Backend : Génération des tags et métadonnées Docker"
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: "Backend : Compilation et publication de l'image sur ghcr.io"
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ────────────────────────────────────────────────────────────────────────────
  #  FRONTEND - ÉTAPE 1 : Intégration Continue (CI Frontend)
  frontend-ci:
    name: "Frontend CI : Lint & Build Vite"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-new

    steps:
      - name: "Frontend : Récupération du code"
        uses: actions/checkout@v4

      - name: "Frontend : Configuration de Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front-new/package-lock.json

      - name: "Frontend : Installation propre des dépendances"
        run: npm ci

      - name: "Frontend : Analyse statique avec le Linter"
        run: npm run lint

      - name: "Frontend : Test de compilation Vite (Build de validation)"
        env:
          VITE_API_URL: /api
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  #  FRONTEND - ÉTAPE 2 : Publication Docker vers GitHub Container Registry (GHCR)
  #  Build multi-stage Vite + Nginx Alpine et push vers ghcr.io
  # ────────────────────────────────────────────────────────────────────────────
  frontend-package:
    name: "Frontend Packaging : Build & Push Docker Image (GHCR)"
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "Frontend : Récupération du code source"
        uses: actions/checkout@v4

      - name: "Frontend : Configuration Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Frontend : Connexion au registre GitHub Container Registry (ghcr.io)"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Frontend : Génération des tags et métadonnées Docker"
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: "Frontend : Compilation et publication de l'image Nginx sur ghcr.io"
        uses: docker/build-push-action@v6
        with:
          context: ./front-new
          file: ./front-new/Dockerfile
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ────────────────────────────────────────────────────────────────────────────
  #  DÉPLOIEMENT CONTINU (CD) - SERVEUR OVH CLOUD
  #  Déploiement basé exclusivement sur les images GHCR (Zero code source)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-ovh:
    name: "Déploiement Continu : OVH Cloud (Zero-Source)"
    runs-on: ubuntu-latest
    needs: [backend-package, frontend-package]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "CD : Récupération du fichier docker-compose.prod.yml"
        uses: actions/checkout@v4

      - name: "CD : Préparation du dossier de déploiement sur le serveur OVH"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            TARGET_DIR="${{ secrets.PROJECT_PATH || '/home/' }}${{ secrets.SERVER_USER }}/immo_tul"
            mkdir -p "$TARGET_DIR"

      - name: "CD : Transfert sécurisé de docker-compose.prod.yml sur le serveur OVH"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "${{ secrets.PROJECT_PATH || '/home/' }}${{ secrets.SERVER_USER }}/immo_tul"

      - name: "CD : Déploiement des conteneurs Backend & Frontend via SSH"
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: BACKEND_ENV,REGISTRY_PASSWORD,ACTOR,REPO
          script: |
            set -e
            TARGET_DIR="${{ secrets.PROJECT_PATH || '/home/' }}${{ secrets.SERVER_USER }}/immo_tul"

            echo "========================================================"
            echo "   DÉPLOIEMENT CONTINU DEVOPS — IMMOTULÉAR (OVH CLOUD)  "
            echo "========================================================"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # ------------------------------------------------------------------
            # 1. NETTOYAGE : Éliminer tout code source résiduel sur le serveur
            # ------------------------------------------------------------------
            if [ -d "$TARGET_DIR/.git" ]; then
              echo "Nettoyage du code source résiduel du serveur..."
              rm -rf backend front-new .git
            fi

            # ------------------------------------------------------------------
            # 2. CONFIGURATION : Injection des variables d'environnement
            # ------------------------------------------------------------------
            echo "Configuration du fichier .env de production..."
            printf '%s\n' "$BACKEND_ENV" > .env
            chmod 600 .env

            # ------------------------------------------------------------------
            # 3. REGISTRE GHCR : Authentification
            # ------------------------------------------------------------------
            echo "Authentification auprès de ghcr.io..."
            echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$ACTOR" --password-stdin || true

            # ------------------------------------------------------------------
            # 4. PULL : Téléchargement des images Backend & Frontend depuis GHCR
            # ------------------------------------------------------------------
            echo "Téléchargement des images depuis ghcr.io..."
            echo "   - Image Backend  : ghcr.io/$REPO/backend:latest"
            echo "   - Image Frontend : ghcr.io/$REPO/frontend:latest"
            docker compose -f docker-compose.prod.yml pull

            # ------------------------------------------------------------------
            # 5. DÉMARRAGE : Lancement propre des conteneurs
            # ------------------------------------------------------------------
            echo " Démarrage des conteneurs de production..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # ------------------------------------------------------------------
            # 6. TESTS DE SANTÉ : Vérification BACKEND (API sur port 3001)
            # ------------------------------------------------------------------
            echo "[BACKEND] Vérification de la disponibilité de l'API..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T backend wget -qO- http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "[BACKEND] API opérationnelle et connectée à la base de données !"
                break
              fi
              echo "   Attente du Backend ($i/30)..."
              sleep 2
            done

            # ------------------------------------------------------------------
            # 6b. SYNCHRONISATION ADMIN : Forcer les identifiants admin@2026
            # ------------------------------------------------------------------
            echo "[ADMIN] Synchronisation forcée du compte admin (admin@immo-tulear.mg)..."
            docker compose -f docker-compose.prod.yml exec -T backend node createAdmin.js

            # ------------------------------------------------------------------
            # 7. TESTS DE SANTÉ : Vérification FRONTEND (Nginx sur port 5005)
            # ------------------------------------------------------------------
            echo "[FRONTEND] Vérification du serveur Nginx sur le port 5005..."
            for i in $(seq 1 30); do
              if curl -s -f http://localhost:5005/ > /dev/null 2>&1; then
                echo "[FRONTEND] Interface web opérationnelle sur http://localhost:5005 !"
                break
              fi
              echo "   Attente du Frontend ($i/30)..."
              sleep 2
            done

            # ------------------------------------------------------------------
            # 8. RAPPORT D'ÉTAT : Conteneurs actifs
            # ------------------------------------------------------------------
            echo " État des conteneurs en production :"
            docker compose -f docker-compose.prod.yml ps

            # ------------------------------------------------------------------
            # 9. NETTOYAGE DOCKER : Élimination des images orphelines
            # ------------------------------------------------------------------
            echo " Nettoyage des anciennes images Docker inutilisées..."
            docker image prune -af --filter "until=24h" || true

            echo " === DÉPLOIEMENT RÉUSSI SUR OVH CLOUD === "
