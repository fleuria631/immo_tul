# =============================================================
#  Nginx Configuration — Frontend ImmoTuléar (Port 5005)
#  Sert le frontend React SPA et proxy les requêtes /api & /uploads
# =============================================================

server {
    listen 5005;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Taille maximale des uploads (photos de propriétés)
    client_max_body_size 25M;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Cache des assets statiques (JS, CSS, images, polices)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Redirection SPA (toutes les routes non trouvées renvoient vers index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy pour l'API Backend Node.js
    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy pour les fichiers uploadés (images des biens)
    location /uploads {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
