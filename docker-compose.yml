# =============================================================
#  Docker Compose — ImmoTuléar (Production Directe)
# =============================================================

services:

  # --- Base de données PostgreSQL ---
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: immo_tul
      POSTGRES_USER: immo_user
      POSTGRES_PASSWORD: immo_tul
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - immo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immo_user -d immo_tul"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend (API Node.js / Express) ---
  backend:
    build: ./backend
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://immo_user:immo_tul@db:5432/immo_tul
    volumes:
      - uploads:/app/uploads
    networks:
      - immo_network

  # --- Frontend (React SPA) ---
  frontend:
    build:
      context: ./front-new
    restart: always
    ports:
      - "5999:5999"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - immo_network

networks:
  immo_network:
    driver: bridge

volumes:
  pg_data:
  uploads:
