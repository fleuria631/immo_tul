# =============================================================
#  Docker Compose — Local Development
#  Usage: docker compose up --build
# =============================================================

name: immo-tulear-dev

services:

  # --- Base de données PostgreSQL ---
  db:
    image: postgres:16-alpine
    container_name: immo_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-immo_tul}
      POSTGRES_USER: ${POSTGRES_USER:-immo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-immo_tul}
    ports:
      - "5432:5432"
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - immo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-immo_user} -d ${POSTGRES_DB:-immo_tul}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Backend API Node.js / Express ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: immo_dev_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-immo_user}:${POSTGRES_PASSWORD:-immo_tul}@db:5432/${POSTGRES_DB:-immo_tul}
    volumes:
      - dev_uploads:/app/uploads
    networks:
      - immo_network

  # --- Frontend React SPA + Nginx ---
  frontend:
    build:
      context: ./front-new
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: immo_dev_frontend
    restart: unless-stopped
    ports:
      - "5005:5005"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - immo_network

networks:
  immo_network:
    driver: bridge

volumes:
  dev_pg_data:
  dev_uploads:
