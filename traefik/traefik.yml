# =============================================================
#  Traefik — Configuration statique (Mode IP / HTTP)
# =============================================================

# --- API / Dashboard ---
api:
  dashboard: true
  insecure: true

# --- Points d'entrée ---
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

# --- Fournisseur Docker ---
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: immo_network

# --- Logs ---
log:
  level: INFO

accessLog:
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100
