# =============================================================
#  Traefik — Configuration dynamique (middlewares)
# =============================================================

http:
  middlewares:
    # Compression gzip
    gzip-compress:
      compress: {}

    # Headers de sécurité
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Powered-By: ""

    # Rate limiting
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
